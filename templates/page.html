<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>$title$</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../assets/css/site.css"/>
  <link rel="stylesheet" href="../../assets/css/themes.css"/>
  <link rel="stylesheet" href="../../assets/css/style.css"/>
  <script>
    MathJax = {
      tex: { inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]']] },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
</head>
<body$if(tema)$ data-tema="$tema$"$endif$>
  <div class="topbar">
    <a class="back" href="../../index.html">← Início</a>
    <span class="sep">|</span>
    <span class="doc-title">$title$</span>
    <span class="spacer"></span>
$if(basename)$
    <a class="btn-dl" href="../$basename$.pdf" download>↓ Baixar PDF</a>
$endif$
  </div>

  <div class="page-wrap">
    <aside class="toc-panel">
      <p class="toc-label">Conteúdo</p>
      <ul id="toc"></ul>
    </aside>

    <article>
      <header class="doc-header">
        <h1>$title$</h1>
        <div class="doc-meta">
$if(author)$<span>✦ $author$</span>$endif$
$if(date)$<span>$date$</span>$endif$
$if(category)$<span style="text-transform:capitalize">$category$</span>$endif$
        </div>
      </header>
      $body$
    </article>
  </div>
  <script src="../../assets/js/site.js"></script>
</body>
</html>
