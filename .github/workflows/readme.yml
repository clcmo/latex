name: README
run-name: Atualizar READMEs

on:
  push:
    branches: [main]
    paths:
      - content/**
      - assets/python/build_readme.py
      - .github/workflows/readme.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writes
  cancel-in-progress: false

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Gerar READMEs das fontes bilíngues
        run: python3 assets/python/build_readme.py

      - name: Commitar se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md
          if git diff --cached --quiet; then
            echo "READMEs já estão atualizados."
          else
            git commit -m "docs: atualiza READMEs gerados [skip ci]"
            git push
          fi
